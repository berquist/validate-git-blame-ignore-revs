---
name: Test and package distribution

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: test-${{github.ref}}-${{github.event.pull_request.number || github.run_number}}
  cancel-in-progress: true

permissions: {}

jobs:

  run-tests:
    name: Test and package on ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    container:
      image: docker.io/archlinux/archlinux:base-devel@sha256:fa0d1643045539ef544d7bde27168390c2b67cd67488f781393649fb48fe1066
    strategy:
      matrix:
        python-version:
          - 3.9
          - "3.10"
          - 3.11
          - 3.12
          - 3.13
          - 3.14
    permissions:
      contents: write  # needed for github-pages-deploy-action
    steps:
      - name: Install system-level dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git libgit2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install just command runner
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: |
          pwd
          ls -al
          echo "GITHUB_WORKSPACE: ${GITHUB_WORKSPACE}"
          just test
